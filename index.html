  // Вывод списка песен
  function renderSongs() {
    const list = document.getElementById("songList");
    list.innerHTML = "";

    songs.forEach(song => {
      list.innerHTML += `
        <div class="song-item">
          ${song.title}
          <br>
          <button class="btn" onclick="playSong('${song.title}', '${song.file}')">▶ Прослушать</button>
          <button class="btn" onclick="downloadSong('${song.file}', '${song.title}')">⬇ Скачать</button>
        </div>
      `;
    });
  }

  // Глобальная статистика
  async function loadGlobalStats() {
    try {
      const { data, error } = await db.rpc("get_global_stats");
      if (error) {
        console.error("Ошибка получения статистики:", error);
        return;
      }
      const stats = data[0];
      document.getElementById("globalStats").innerHTML =
        `Глобальная статистика — Прослушиваний: ${stats.total_plays} · Скачиваний: ${stats.total_downloads}`;
    } catch (err) {
      console.error("Ошибка:", err);
    }
  }

  // +1 прослушивание и запуск плеера
  async function playSong(title, file) {
    const player = document.getElementById("audioPlayer");
    const titleEl = document.getElementById("currentSongTitle");

    titleEl.textContent = "Сейчас играет: " + title;
    player.src = "songs/" + file; // файлы лежат в папке songs/
    player.play();

    await db.rpc("increment_global_play");
    loadGlobalStats();
  }

  // +1 скачивание
  async function downloadSong(file, title) {
    await db.rpc("increment_global_download");
    loadGlobalStats();
    window.location.href = "songs/" + file;
  }

  // Старт
  document.addEventListener("DOMContentLoaded", () => {
    renderSongs();
    loadGlobalStats();
  });
