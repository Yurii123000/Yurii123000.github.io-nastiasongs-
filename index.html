    try {
      await db.rpc("increment_download", { song_title: songs[index].title });
      loadGlobalStats();
    } catch (err) {
      console.error("Помилка запису скачування:", err);
    }
  }

  // Рендеринг списку
  function renderList(filter = "") {
    trackList.innerHTML = "";

    songs.forEach((song, index) => {
      if (song.title.toLowerCase().includes(filter.toLowerCase())) {
        const li = document.createElement("li");

        const spanTitle = document.createElement("span");
        spanTitle.textContent = "🎵 " + song.title;
        spanTitle.style.flexGrow = "1";
        spanTitle.style.cursor = "pointer";
        spanTitle.onclick = () => playTrack(index);

        const dlBtn = document.createElement("a");
        dlBtn.textContent = "Скачати";
        dlBtn.className = "dl-btn";
        dlBtn.href = "songs/" + song.file;
        dlBtn.download = song.file;
        dlBtn.onclick = (e) => trackDownload(index, e);

        li.appendChild(spanTitle);
        li.appendChild(dlBtn);
        trackList.appendChild(li);
      }
    });
  }
