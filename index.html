  let currentIndex = 0;
  const audio = document.getElementById('audio');
  const trackList = document.getElementById('trackList');
  const searchBox = document.getElementById('searchBox');
  const nowPlaying = document.getElementById('nowPlaying');
  let repeat = false;

  async function loadGlobalStats() {
    const { data, error } = await db.rpc("get_song_stats");
    if (error) return;

    let plays = 0, downloads = 0;

    data.forEach(s => {
      plays += s.plays_count;
      downloads += s.downloads_count;
    });

    document.getElementById("globalStats").innerHTML =
      `Глобальная статистика — Прослушиваний: <b>${plays}</b> · Скачиваний: <b>${downloads}</b>`;
  }

  function renderList(filter = "") {
    trackList.innerHTML = "";
    tracks.forEach((track, index) => {
      if (track.toLowerCase().includes(filter.toLowerCase())) {
        const li = document.createElement("li");
        li.textContent = track.replace(".mp3", "");
        li.onclick = () => playTrack(index);
        trackList.appendChild(li);
      }
    });
  }

  renderList();
  loadGlobalStats();

  searchBox.addEventListener("input", () => {
    renderList(searchBox.value);
  });

  async function playTrack(index) {
    currentIndex = index;
    const file = "songs/" + tracks[index];

    audio.src = file;
    audio.play();

    nowPlaying.innerText = "Сейчас играет: " + tracks[index].replace(".mp3", "");

    await db.rpc("increment_play", { song_id: index + 1 });
    loadGlobalStats();
  }

  async function downloadTrack(index) {
    await db.rpc("increment_download", { song_id: index + 1 });
    loadGlobalStats();
  }

  function prevTrack() {
    currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
    playTrack(currentIndex);
  }

  function nextTrack() {
    currentIndex = (currentIndex + 1) % tracks.length;
    playTrack(currentIndex);
  }

  function shuffleTrack() {
    currentIndex = Math.floor(Math.random() * tracks.length);
    playTrack(currentIndex);
  }

  function repeatTrack() {
    repeat = !repeat;
    alert("Repeat: " + (repeat ? "ON" : "OFF"));
  }

  audio.addEventListener("ended", () => {
    repeat ? playTrack(currentIndex) : nextTrack();
  });
